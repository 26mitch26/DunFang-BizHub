name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: ./dunfang-backend
        run: mvn clean compile -DskipTests

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dunfang-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./dunfang-frontend
        run: npm ci

      - name: Type check
        working-directory: ./dunfang-frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: ./dunfang-frontend
        run: npm run build
