server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: dunfang-bizhub

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dunfang_bizhub?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:dunfang2024}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:dunfang-bizhub-jwt-secret-key-2024-must-be-at-least-256-bits-long}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:7200000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:dunfang}
  secret-key: ${MINIO_SECRET_KEY:dunfang2024}
  bucket: ${MINIO_BUCKET:dunfang-bizhub}

ai-worker:
  url: ${AI_WORKER_URL:http://localhost:8001}

logging:
  level:
    com.dunfang.bizhub: ${LOG_LEVEL:debug}
