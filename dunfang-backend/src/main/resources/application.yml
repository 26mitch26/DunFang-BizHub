server:
  port: 8080

spring:
  application:
    name: dunfang-bizhub

  datasource:
    url: jdbc:mysql://localhost:3306/dunfang_bizhub?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: dunfang2024
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT
jwt:
  secret: dunfang-bizhub-jwt-secret-key-2024-must-be-at-least-256-bits-long
  access-token-expiration: 7200000    # 2 hours
  refresh-token-expiration: 604800000 # 7 days

# MinIO
minio:
  endpoint: http://localhost:9000
  access-key: dunfang
  secret-key: dunfang2024
  bucket: dunfang-bizhub

logging:
  level:
    com.dunfang.bizhub: debug
